spreadsheet_resources:
  resources_servers:
    spreadsheet:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Stateful spreadsheet tools and remote LibreOffice rewards
      service_url: http://SERVICE_IP:8088
      # Supply both secrets via private Gym config; never dataset/model arguments.
      api_key: ???
      session_secret: ???
      operation_timeout: 300
spreadsheet_agent:
