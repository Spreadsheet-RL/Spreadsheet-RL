[project]
name = "async-reward-api"
version = "0.1.0"
description = "Async spreadsheet reward API (submit job + poll result) backed by Excel recalculation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "openpyxl>=3.1.5",
  "pywin32>=306; platform_system == 'Windows'",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
async-reward-api = "async_reward_api.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["async_reward_api*"]
