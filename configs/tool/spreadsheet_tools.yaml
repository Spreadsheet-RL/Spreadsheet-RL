tools:
  - class_name: "verl.tools.inspect_range.InspectRangeTool"
    config:
      parallel_safe: true
      max_cells: 400
      max_summary_cells: 100000
      max_ranges: 20
      max_response_chars: 10240
      max_file_mb: 100
      type: native

    tool_schema:
      type: "function"
      function:
        name: "inspect_range"
        description: "Inspect A1 ranges. mode=cells returns cell records; mode=summary returns exact content counts without values."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for an unqualified range; omit when range is sheet-qualified. Defaults to the first sheet."
            range:
              type: "string"
              description: "One A1 range or comma-separated ranges (max 20). cells returns up to 400 records per range and may truncate earlier to fit the response; continue from omitted_from. summary scans up to 100000 cells per call."
            include_details:
              type: "boolean"
              description: "In cells mode, include number_format, style, and overlapping sheet metadata. Default false; incompatible with summary."
            mode:
              type: "string"
              enum: ["cells", "summary"]
              description: "cells (default) returns address/value/formula records and a row-major omitted_from cursor when truncated. summary returns exact non-empty/empty/formula/error counts and non_empty_fraction."
          required: ["range"]

  - class_name: "verl.tools.list_sheets.ListSheetsTool"
    config:
      parallel_safe: true
      max_file_size_mb: 100
      max_response_chars: 4096
      type: native

    tool_schema:
      type: "function"
      function:
        name: "list_sheets"
        description: "List sheet names, order, visibility, active state, and dimensions. Use only when sheets are unknown or to verify sheet changes."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
          required: []

  - class_name: "verl.tools.manage_sheet.ManageSheetTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      lock_timeout_s: 30
      max_sheets: 200
      max_response_chars: 4096

    tool_schema:
      type: "function"
      function:
        name: "manage_sheet"
        description: "Create, rename, delete, copy, move, hide, or unhide a sheet. index is the 0-based final position for create/copy/move. The last visible sheet cannot be deleted or hidden. Copies omit charts/images; renames do not rewrite formula references. Returns ordered sheets."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            action:
              type: "string"
              enum: ["create", "rename", "delete", "copy", "move", "hide", "unhide"]
            sheet_name:
              type: "string"
              description: "Target sheet; for create, the new sheet name."
            new_name:
              type: "string"
              description: "Required rename destination; optional copy name."
            index:
              type: "integer"
              description: "0-based final position for create/copy/move; required for move."
          required: ["action", "sheet_name"]

  - class_name: "verl.tools.find_cells.FindCellsTool"
    config:
      parallel_safe: true
      max_file_size_mb: 100
      max_response_chars: 4096
      type: native

    tool_schema:
      type: "function"
      function:
        name: "find_cells"
        description: "Find text in cell values/formulas. Returns addresses in matches_csv; include_values adds matched snippets."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet to search; omit when range is sheet-qualified. Defaults to all sheets."
            query:
              type: "string"
              description: "Non-empty text or restricted regex; cannot locate blank cells—inspect the range instead. Regex excludes groups, alternation, +, ?, and {m,n}."
            match:
              type: "string"
              enum: ["contains", "equals", "prefix", "regex"]
              description: "Default contains."
            search_in:
              type: "string"
              enum: ["values", "formulas", "both"]
              description: "Default values."
            case_sensitive:
              type: "boolean"
              description: "Default false."
            include_values:
              type: "boolean"
              description: "Include matched value/formula snippets. Default false."
            return:
              type: "string"
              enum: ["first", "all"]
              description: "Default first."
            max_results:
              type: "integer"
              description: "Maximum matches when return=all. Default 20."
            range:
              type: "string"
              description: "A1 search range; defaults to each sheet's used range."
          required: ["query"]

  - class_name: "verl.tools.write_range.WriteRangeTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      lock_timeout_s: 30
      max_write_cells: 50000
      max_cell_chars: 8192
      max_response_chars: 4096

    tool_schema:
      type: "function"
      function:
        name: "write_range"
        description: "Write static values; formula strings are rejected. A single-cell range anchors the input, and scalars/rows/columns broadcast. Creates missing sheets. Dependent formulas remain stale until recalculated."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for an unqualified range; omit when range is sheet-qualified. Defaults to the first sheet."
            range:
              type: "string"
              description: "A1 target cell or finite rectangle."
            data:
              type: ["array", "string", "number", "boolean"]
              description: "Scalar, 1D row, or rectangular 2D array. For non-scalar data, match an explicit rectangle's shape or pass only its top-left cell. null entries skip cells; empty strings clear; leading apostrophes force literal text."
          required: ["range", "data"]

  - class_name: "verl.tools.format_range.FormatRangeTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      lock_timeout_s: 30
      max_format_cells: 100000
      max_response_chars: 4096

    tool_schema:
      type: "function"
      function:
        name: "format_range"
        description: "Apply common cell, row, and column formatting to a finite A1 range; returns applied options and samples. Unknown parameters are rejected."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for an unqualified range; omit when range is sheet-qualified. Defaults to the first sheet."
            range:
              type: "string"
              description: "Finite A1 cell range."
            fill_color:
              type: "string"
              description: "Cell fill/background color as #RRGGBB, RRGGBB, AARRGGBB, or a common color name like red."
            font_color:
              type: "string"
              description: "Font color as #RRGGBB, RRGGBB, AARRGGBB, or a common color name like red."
            bold:
              type: "boolean"
              description: "Set font bold on or off."
            italic:
              type: "boolean"
              description: "Set font italic on or off."
            underline:
              type: "boolean"
              description: "Set single underline on or off."
            number_format:
              type: "string"
              description: "Excel number format code, e.g. $#,##0.00 or 0.0%."
            horizontal_alignment:
              type: "string"
              enum: ["general", "left", "center", "right", "fill", "justify", "centerContinuous", "distributed"]
            vertical_alignment:
              type: "string"
              enum: ["top", "center", "bottom", "justify", "distributed"]
            wrap_text:
              type: "boolean"
              description: "Set text wrapping on or off."
            shrink_to_fit:
              type: "boolean"
              description: "Shrink displayed text to fit the cell width."
            text_rotation:
              type: "integer"
              description: "Text rotation from 0 to 180, or 255 for stacked text."
            border_style:
              type: "string"
              description: "Border style for all sides, e.g. thin, medium, thick, dashed, dotted."
            border_color:
              type: "string"
              description: "Border color as hex or a common name; without border_style, applies thin borders."
            row_height:
              type: "number"
              description: "Optional row height applied to rows touched by the range."
            column_width:
              type: "number"
              description: "Optional column width applied to columns touched by the range."
          required: ["range"]

  - class_name: "verl.tools.formula_fill.FillFormulaTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      max_fill_cells: 300000
      max_formula_template_chars: 8192
      deduplicate_successful_calls: true
      lock_timeout_s: 30
      recalc_url: "${oc.env:SPREADSHEET_RL_RECALC_URL,http://127.0.0.1:5000/recalculate}"
      recalc_timeout_s: 180
      max_response_chars: 4096

    tool_schema:
      type: "function"
      function:
        name: "fill_formula"
        description: "Fill one formula pattern across a rectangle. Only for formula cells, not formatting, sorting/filtering, copying, or structural edits. Invalid formulas are rejected. Excel recalculates before commit; failures leave the workbook unchanged and successful responses need no further recalculation. Identical successful calls may return a cache hit. Skips merged placeholders and returns samples."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for an unqualified start_cell; omit when start_cell is sheet-qualified. Defaults to the first sheet."
            start_cell:
              type: "string"
              description: "Start cell A1 reference (e.g. D2 or Sheet1!D2). If it does not include a sheet name, uses sheet_name (or the first worksheet by default)."
            end_row:
              type: "integer"
              description: "Last row (inclusive) to fill to. If omitted, uses start_cell row."
            end_col:
              type: "string"
              description: "Last column letter (inclusive) to fill to (e.g. H or AB). If omitted, uses start_cell column."
            formula_template:
              type: "string"
              description: "Formula beginning with =; do not wrap another formula as text (for example =\"=SUM(...)\"). Cross-sheet references use 'Sheet Name'!$A$1. Relative references translate by row and column."
          required: ["start_cell", "formula_template"]

  - class_name: "verl.tools.clear_range.ClearRangeTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      lock_timeout_s: 30
      max_iter_cells: 50000
      max_scan_cells: 500000
      recalc_url: "${oc.env:SPREADSHEET_RL_RECALC_URL,http://127.0.0.1:5000/recalculate}"
      recalc_timeout_s: 180
      max_response_chars: 4096

    tool_schema:
      type: "function"
      function:
        name: "clear_range"
        description: "Clear values/formulas without shifting cells; use delete_rows/delete_columns when cells should shift. Supports cell, rectangle, whole-row, and whole-column ranges; merged intersections clear their anchors. Excel recalculates before commit. Returns changed-cell count and samples."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for an unqualified range; omit when range is sheet-qualified. Defaults to the first sheet."
            range:
              type: "string"
              description: "A1 cell, rectangle, whole-row, or whole-column range."
          required: ["range"]

  - class_name: "verl.tools.delete_rows_columns.DeleteRowsTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      lock_timeout_s: 30
      max_delete_rows: 10000
      recalc_url: "${oc.env:SPREADSHEET_RL_RECALC_URL,http://127.0.0.1:5000/recalculate}"
      recalc_timeout_s: 180

    tool_schema:
      type: "function"
      function:
        name: "delete_rows"
        description: "Delete worksheet rows and shift cells up; use clear_range to blank without shifting. Excel recalculates before commit."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for unqualified row ranges; omit when rows are sheet-qualified. Defaults to the first sheet."
            rows:
              type: "array"
              description: "List of row ranges to delete (e.g. ['2:3'], ['3', '5', '7:9'], or ['Sheet1!5:10']). Use a single-item list for one range."
              items:
                type: "string"
          required: ["rows"]

  - class_name: "verl.tools.delete_rows_columns.DeleteColumnsTool"
    config:
      parallel_safe: false
      type: native
      max_file_size_mb: 100
      lock_timeout_s: 30
      max_delete_cols: 1000
      recalc_url: "${oc.env:SPREADSHEET_RL_RECALC_URL,http://127.0.0.1:5000/recalculate}"
      recalc_timeout_s: 180

    tool_schema:
      type: "function"
      function:
        name: "delete_columns"
        description: "Delete worksheet columns and shift cells left; use clear_range to blank without shifting. Excel recalculates before commit."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            sheet_name:
              type: "string"
              description: "Sheet for unqualified column ranges; omit when columns are sheet-qualified. Defaults to the first sheet."
            columns:
              type: "array"
              description: "List of column ranges to delete (e.g. ['B:D'], ['B', 'D', 'F:G'], or ['Sheet1!A:C']). Use a single-item list for one range."
              items:
                type: "string"
          required: ["columns"]

  - class_name: "verl.tools.recalculate.RecalculateAndReadTool"
    config:
      parallel_safe: false
      recalc_url: "${oc.env:SPREADSHEET_RL_RECALC_URL,http://127.0.0.1:5000/recalculate}"
      timeout_s: 180
      max_file_size_mb: 100
      max_response_chars: 4096
      type: native

    tool_schema:
      type: "function"
      function:
        name: "recalculate_and_read"
        description: "Recalculate the workbook in Excel, save it when safe, and read requested ranges. Small ranges preserve matrix shape; large ranges return addressed samples. Reports updated, values_source, and any writeback_error."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative workbook path; omit for data.xlsx."
            cell_ranges:
              type: "array"
              description: "A1 ranges to read after recalculation."
              items:
                type: "string"
          required: ["cell_ranges"]

  - class_name: "verl.tools.sandbox_fusion_tools.SandboxFusionTool"
    config:
      parallel_safe: false
      # Prefer an environment-provided endpoint (e.g. set by SLURM), fallback to the public template URL.
      sandbox_fusion_url: "${oc.env:SANDBOX_FUSION_URL,http://127.0.0.1:8080/run_code}"
      num_workers: 4
      enable_global_rate_limit: false
      default_timeout: 120
      default_language: "python"
      memory_limit_mb: 1024
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        description: "Execute Python code (fresh process each call)."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Python code to execute."
          required: ["code"]
