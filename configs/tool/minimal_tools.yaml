tools:
  - class_name: "verl.tools.recalculate.RecalculateAndReadTool"
    config:
      recalc_url: "${oc.env:SPREADSHEET_RL_RECALC_URL,http://127.0.0.1:5000/recalculate}"
      timeout_s: 180
      max_file_size_mb: 100
      type: native

    tool_schema:
      type: "function"
      function:
        name: "recalculate_and_read"
        description: "Recalculate a workbook in Excel (remote service), attempt to overwrite the workbook file, and return values preserving the requested shape. Returns updated/values_source (and writeback_error on failure). Small ranges return top_left + addresses + values matrices; large ranges are sampled as cells with addresses."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Optional relative path to the workbook file (e.g. data.xlsx). Defaults to data.xlsx in the workspace."
            cell_ranges:
              type: "array"
              description: "List of A1 cell ranges to read from the recalculated workbook (e.g. ['A1', 'Sheet1!B2:C3'])."
              items:
                type: "string"
          required: ["cell_ranges"]

  - class_name: "verl.tools.sandbox_fusion_tools.SandboxFusionTool"
    config:
      # Prefer an environment-provided endpoint (e.g. set by SLURM), fallback to the public template URL.
      sandbox_fusion_url: "${oc.env:SANDBOX_FUSION_URL,http://127.0.0.1:8080/run_code}"
      num_workers: 4
      enable_global_rate_limit: false
      default_timeout: 120
      default_language: "python"
      memory_limit_mb: 1024
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        description: "Execute Python code (fresh process each call)."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Python code to execute."
          required: ["code"]
